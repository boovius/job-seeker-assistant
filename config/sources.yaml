version: 1

core_preferences:
  location: ""
  work_mode: ""
  salary: ""
  sector: ""
  target_role: ""
  company_size: ""

core_values:
  values: []
  dream_job_description: ""

sources:
  greenhouse:
    adapter: greenhouse_job_board_v1
    kind: ats_api
    base_url: https://boards.greenhouse.io
    enabled: true
    config:
      board_tokens: []

  lever:
    adapter: lever_postings_v1
    kind: ats_api
    base_url: https://jobs.lever.co
    enabled: true
    config:
      companies: []

  climatebase:
    adapter: climatebase_v1
    kind: job_board
    base_url: https://climatebase.org
    enabled: true
    config:
      search_profiles:
        - role_keywords:
            - technical product manager
          sector_keywords:
            - climate
          location: Los Angeles, CA
          remote: true

  remotive:
    adapter: remotive_api_v1
    kind: job_board
    base_url: https://remotive.com
    enabled: true
    config:
      endpoint: https://remotive.com/api/remote-jobs
      search_profiles:
        - role_keywords:
            - technical product manager
          sector_keywords:
            - climate
          location: Los Angeles, CA
          remote: true
      categories: []

  adzuna:
    adapter: adzuna_api_v1
    kind: job_board
    base_url: https://api.adzuna.com
    enabled: false
    config:
      country: us
      results_per_page: 50
      search_profiles:
        - role_keywords:
            - technical product manager
          sector_keywords:
            - climate
          location: Los Angeles, CA
          remote: true

  jooble:
    adapter: jooble_api_v1
    kind: job_board
    base_url: https://jooble.org
    enabled: false
    config:
      location: United States
      page: 1
      search_profiles:
        - role_keywords:
            - technical product manager
          sector_keywords:
            - climate
          location: Los Angeles, CA
          remote: true
